<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercanti del Mediterraneo</title>
<style>
:root{--bg:#0e1b26;--card:#162a3a;--ink:#e8eef2;--mut:#8fa6b6;--gold:#e0b252;--line:#27465c;--ok:#6fcf97;--bad:#f2837a;--btn:#21465f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:122px 10px 74px}
body.start{padding-top:56px;padding-bottom:20px}
body.start nav,body.start .days{display:none}
h2{font:600 20px Georgia,serif;margin:6px 0 10px;color:var(--gold)}
header{position:fixed;top:0;left:0;right:0;background:#0a141c;border-bottom:1px solid var(--line);padding:8px 12px;z-index:5}
#top{font:600 17px Georgia,serif;color:var(--gold);display:flex;justify-content:space-between;gap:8px}
.days{display:flex;gap:6px;margin-top:6px}
.days button{flex:1;padding:7px 4px}
nav{position:fixed;bottom:0;left:0;right:0;overflow-x:auto;display:flex;background:#0a141c;border-top:1px solid var(--line);z-index:5}
nav button{flex:1 0 auto;background:none;border:0;color:var(--mut);padding:14px 11px;font-size:12px;border-radius:0}
nav button.on{background:none;color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
button,select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button:active{background:var(--line)}
button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
select{width:100%;margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b button{flex:1;min-width:84px}
small,.m{color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.lo{color:var(--ok);font-weight:700}.hi{color:var(--bad);font-weight:700}
#toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:9;max-width:90%;text-align:center;pointer-events:none}
.log p{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
input{font:inherit;width:100%;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 10px}#bar{height:3px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--gold)}#sub{font-size:12px;color:var(--mut)}body.start #bar,body.start #sub{display:none}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px}.pb i{display:block;height:100%;background:var(--gold)}button:disabled{opacity:.5}

 for(const c in C){S.pop[c]=0;S.pros[c]=0;S.civ[c]=[];S.dep[c]=G.map(()=>0);S.wh[c]=0;S.own[c]=0;S.lea[c]=0;S.popu[c]=C[c][5];S.sat[c]=60;S.mk[c]=G.map((g,i)=>(RATE[c][i]>0?1.6:.7)*refOf(c,i))}
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.ships)init();
if(!S.bld)S.bld=[];
if(!S.pop){S.pop={};S.pros={};S.civ={};for(const c in C){S.pop[c]=0;S.pros[c]=0;S.civ[c]=[]}}
if(!S.pp)S.pp={};
if(!S.depc)S.depc={};
if(!S.own){S.own={};S.lea={};for(const c in C){S.own[c]=0;S.lea[c]=0}}
for(const c in S.wh)if(S.wh[c]>0)S.wh[c]=Math.ceil(S.wh[c]/250)*250;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.opacity=0,2200)}
function done(m){save();render();if(m)toast(m)}
function go(t){if(t==='mappa')mapScroll=null;S.ui.tab=t;done();scrollTo(0,0)}
function setQ(x){S.ui.qty=x;done()}
function setSpeed(n){speed=n;renderSpeed()}
function start(c){
 S.name=esc(($('#nm').value||'').trim().slice(0,24))||'Mercante';
 S.started=true;S.home=c;S.neutral=C[c][6]==='N';S.ui.city=c;S.pop[c]=10;acc=0;
 S.ships.push({id:S.nid++,name:'Santa Lucia',type:'Cocca',city:c,dest:null,arr:0,st:0,arm:0,cargo:G.map(()=>0)});
 S.log.unshift(`Giorno 1: ${S.name} inizia la sua avventura da ${c}.`);
 done();scrollTo(0,0);
}
const LIM=[3000,15000,40000,100000,250000,600000,1200000,2500000];
const lim=()=>LIM[S.rank];
const NEED_RANK=3,NEED_POP=25,NEED_BUY=2;
const can=c=>c===S.home||(S.rank>=NEED_RANK&&(S.pop[c]||0)>=NEED_POP);
const need=c=>`Per costruire a ${c} serve il titolo di ${RANKS[NEED_RANK][0]} e popolarità ${NEED_POP} in città (ora ${(S.pop[c]||0).toFixed(1)}).`;
const facOf=c=>C[c][6];
const myFac=()=>S.neutral?'N':facOf(S.home);
const wk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const atWar=(a,b)=>a!==b&&a!=='N'&&b!=='N'&&(S.war[wk(a,b)]||0)>S.day;
const blockReason=c=>{
 if(!S.started)return '';
 if((S.siege[c]||0)>S.day)return 'assedio';
 if((S.pop[c]||0)<-30)return 'reputazione';
 if(atWar(myFac(),facOf(c)))return 'guerra';
 return '';
};
const BLK={assedio:'la città è assediata',reputazione:'sei un ricercato in questa città',guerra:'la tua fazione è in guerra con questa città'};
const blocked=c=>!!blockReason(c);
const blkMsg=c=>`Porto di ${c} bloccato: ${BLK[blockReason(c)]}.`;
const hp=s=>s.hp===undefined?100:s.hp;
const strength=s=>(s.arm||0)*3+(s.wp||0)*2+hp(s)/20;
const infl=f=>Math.max(-100,...Object.keys(C).filter(c=>facOf(c)===f).map(c=>S.pop[c]||0));
const NEED_MED=6;
const RIV=[['Venezia','Genova',4],['Genova','Pisa',3],['Aragona','Genova',2],['Venezia','Bizantino',2],['Venezia','Ragusa',1.5],['Pisa','Amalfi',1],['Aragona','Hafsidi',3],['Gerusalemme','Mamelucco',4],['Cipro','Mamelucco',3],['Bizantino','Mamelucco',1.5],['Sicilia','Hafsidi',2],['Provenza','Aragona',1],['Genova','Bizantino',1],['Amalfi','Sicilia',1],['Pisa','Hafsidi',1],['Venezia','Mamelucco',.5]];
const cb=s=>s.cost||(s.cost=G.map(()=>0));
const dc=c=>S.depc[c]||(S.depc[c]=G.map(()=>0));
const avgOf=(cost,q)=>q>0?cost/q:0;
function loseShare(s,f){let lost=0;const old=s.cargo.slice(),cs=cb(s);s.cargo=s.cargo.map(q=>{const l=Math.floor(q*f);lost+=l;return q-l});cs.forEach((v,i)=>{if(old[i])cs[i]=v*s.cargo[i]/old[i]});return lost}
function sink(s){S.ships=S.ships.filter(x=>x!==s);S.log.unshift(`Giorno ${S.day}: la ${s.name} è affondata con il suo carico.`)}
function autoStep(s){
 const r=s.route,c=s.city;
 if(c!==r.a&&c!==r.b){if(blocked(r.a)){s.wait=true;s.next=r.a;return}s.dest=r.a;s.st=S.day;s.arr=S.day+days(c,r.a,s);return}
 let sold=0;const g0=S.gold;
 for(let i=0;i<G.length;i++)while(s.cargo[i]>0){S.gold+=sp(c,i);S.mk[c][i]++;s.cargo[i]--;sold++}
 s.cost=G.map(()=>0);
 const rev=S.gold-g0,gi=c===r.a?r.ga:r.gb;let bought=0;
 if(gi>=0)while(tot(s.cargo)<T[s.type].cap){const p=bp(c,gi);if(S.gold<p||S.mk[c][gi]<1)break;S.gold-=p;S.mk[c][gi]--;s.cargo[gi]++;cb(s)[gi]+=p;bought++}
 S.pop[c]=Math.min(100,(S.pop[c]||0)+(sold+bought)*.02);
 const o=c===r.a?r.b:r.a;
 if(blocked(o)){s.wait=true;s.next=o}else{s.dest=o;s.st=S.day;s.arr=S.day+days(c,o,s)}
 S.log.unshift(`Giorno ${S.day}: rotta della ${s.name} a ${c}: venduti ${sold} pezzi per ${fmt(rev)} ₯, comprati ${bought}, poi verso ${o}${blocked(o)?' (bloccato: attende fuori dalle acque)':''}.`);
}
function setRoute(id){
 const s=S.ships.find(x=>x.id===id),v=k=>$('#'+k+id).value;
 const a=v('ra'),b=v('rb');
 if(a===b)return toast('Scegli due porti diversi');
 s.route={a,b,ga:+v('rga'),gb:+v('rgb')};
 if(!s.dest){if(blocked(s.city)){s.wait=true;s.next=null}else autoStep(s)}
 done('Rotta avviata per '+s.name);
}
function xfer(s,i,dir,n){
 const dep=S.dep[s.city],dcs=dc(s.city),scs=cb(s);let m;
 if(dir>0){m=Math.min(n,dep[i],T[s.type].cap-tot(s.cargo));const a=avgOf(dcs[i],dep[i]);dep[i]-=m;dcs[i]=Math.max(0,dcs[i]-a*m);s.cargo[i]+=m;scs[i]+=a*m}
 else{m=Math.max(0,Math.min(n,s.cargo[i],S.wh[s.city]-tot(dep)));const a=avgOf(scs[i],s.cargo[i]);s.cargo[i]-=m;scs[i]=Math.max(0,scs[i]-a*m);dep[i]+=m;dcs[i]+=a*m}
 return m;
}
function moveS(id,i,dir){
 const s=S.ships.find(x=>x.id===id);
 if(blocked(s.city))return toast(blkMsg(s.city));
 const m=xfer(s,i,dir,qty());
 done(m?`Spostati ${m} ${G[i]}`:(dir>0?'Nave piena o niente nel deposito':'Deposito pieno o niente da scaricare'));
}
function loadAll(id,dir){
 const s=S.ships.find(x=>x.id===id);let t=0;
 if(blocked(s.city))return toast(blkMsg(s.city));
 for(let i=0;i<G.length;i++)t+=xfer(s,i,dir,9999);
 done(t?`Spostate ${t} merci`:'Niente da spostare');
}
function donate(n){
 const c=S.ui.city;
 if(blocked(c))return toast(blkMsg(c));
 if(S.gold<n)return toast('Ducati insufficienti');
 S.gold-=n;S.pop[c]=Math.min(100,(S.pop[c]||0)+n/250);S.pros[c]=Math.min(100,(S.pros[c]||0)+n/1000);
 S.log.unshift(`Giorno ${S.day}: doni ${fmt(n)} ₯ alla città di ${c}.`);
 done(`Donati ${fmt(n)} ₯: popolarità +${(n/250).toFixed(1)}`);
}
function civ(i){
 const c=S.ui.city,b=CIV[i];
 if(blocked(c))return toast(blkMsg(c));
 if(S.civ[c].includes(i))return;
 if(!can(c))return toast(need(c));
 if((S.pop[c]||0)<b[2])return toast(`Serve popolarità ${b[2]} a ${c}`);
 if(S.gold<b[1])return toast('Ducati insufficienti');
 S.gold-=b[1];S.civ[c].push(i);
 S.pop[c]=Math.min(100,(S.pop[c]||0)+b[3]);S.pros[c]=Math.min(100,(S.pros[c]||0)+b[4]);
 S.log.unshift(`Giorno ${S.day}: fai costruire ${b[0].toLowerCase()} a ${c}.`);
 done(`${b[0]} costruito a ${c}!`);
}
function stopRoute(id){S.ships.find(x=>x.id===id).route=null;done('Rotta fermata')}
function build(){
 if(blocked(S.ui.city))return toast(blkMsg(S.ui.city));
 if(!can(S.ui.city))return toast(need(S.ui.city));
 if(S.gold<1500)return toast('Ducati insufficienti');
 S.gold-=1500;S.bld.push({city:S.ui.city,good:+$('#bg').value,lv:1,acc:0});
 done('Laboratorio costruito a '+S.ui.city);
}
function upgrade(i){
 const b=S.bld[i];
 if(b.lv>=5)return;
 if(S.gold<1000)return toast('Ducati insufficienti');
 S.gold-=1000;b.lv++;done('Laboratorio al livello '+b.lv);
}
function buyMag(){
 const c=S.ui.city;
 if(blocked(c))return toast(blkMsg(c));
 if(S.rank<NEED_BUY)return toast(`Serve il titolo di ${RANKS[NEED_BUY][0]}`);
 if(!can(c))return toast(need(c));
 if(S.gold<2500)return toast('Ducati insufficienti');
 S.gold-=2500;S.own[c]+=250;S.wh[c]+=250;
 S.log.unshift(`Giorno ${S.day}: compri un magazzino a ${c}.`);
 done(`Magazzino acquistato a ${c}`);
}
function redeem(){
 const c=S.ui.city,rented=Math.max(0,S.wh[c]-(S.own[c]-S.lea[c]));
 if(blocked(c))return toast(blkMsg(c));
 if(S.rank<NEED_BUY||!can(c))return toast('Non hai ancora il permesso');
 if(rented<250)return toast('Nessun magazzino in affitto da riscattare');
 if(S.gold<2000)return toast('Ducati insufficienti');
 S.gold-=2000;S.own[c]+=250;done('Magazzino riscattato: niente più affitto da pagare');
}
function lease(d){
 const c=S.ui.city;
 if(blocked(c))return toast(blkMsg(c));
 if(d>0){
  if(S.own[c]-S.lea[c]<250||S.wh[c]<250)return toast('Serve un tuo magazzino libero');
  if(S.wh[c]-250<tot(S.dep[c]))return toast('Svuota il magazzino prima di darlo in affitto');
  S.lea[c]+=250;S.wh[c]-=250;done('Magazzino dato in affitto a terzi');
 }else{
  if(S.lea[c]<250)return;
  S.lea[c]-=250;S.wh[c]+=250;done('Magazzino ripreso');
 }
}
const magCard=c=>{
 const o=S.own[c]||0,l=S.lea[c]||0,rented=Math.max(0,S.wh[c]-(o-l)),ok=S.rank>=NEED_BUY&&can(c);
 return `<div class="card"><b>Magazzini a ${c}</b><br><small>Capacità usabile ${S.wh[c]}: in affitto ${rented}, tuoi ${Math.max(0,o-l)}. Locati a terzi: ${l}${l?` (rendono ${fmt(l/250*70*(1+(S.pros[c]||0)/100))} ₯ a settimana)`:''}.<br>${ok?'Puoi comprare i magazzini e darli in affitto a terzi.':S.rank<NEED_BUY?`Per comprare serve il titolo di ${RANKS[NEED_BUY][0]}.`:need(c)}</small>
 <div class="b"><button onclick="buyMag()" ${ok?'':'disabled'}>Compra (2.500 ₯)</button><button onclick="redeem()" ${ok&&rented>=250?'':'disabled'}>Riscatta affitto (2.000 ₯)</button><button onclick="lease(1)" ${o-l>=250&&S.wh[c]>=250?'':'disabled'}>Metti in affitto</button><button onclick="lease(-1)" ${l>=250?'':'disabled'}>Riprendi</button></div></div>`;
};
function expand(){
 const c=S.ui.city;
 if(blocked(c))return toast(blkMsg(c));
 if(!can(c))return toast(need(c));
 if(S.gold<400)return toast('Ducati insufficienti');
 S.gold-=400;S.wh[c]+=250;S.log.unshift(`Giorno ${S.day}: affitti un magazzino a ${c} (capacità ${S.wh[c]}).`);done(`Magazzino a ${c}: capacità ${S.wh[c]}`);
}
function armShip(id,k){
 const s=S.ships.find(x=>x.id===id);
 if(blocked(s.city))return toast(blkMsg(s.city));
 if(s.dest)return toast('La nave deve essere in porto');
 const w=k==='w',mx=w?3:6,cost=w?200:400,key=w?'wp':'arm';
 if((s[key]||0)>=mx)return toast(w?'Equipaggio già armato al massimo':'Già al massimo dei cannoni');
 if(S.gold<cost)return toast('Ducati insufficienti');
 S.gold-=cost;s[key]=(s[key]||0)+1;
 done(w?`${s.name}: armi ${s.wp}/3`:`${s.name}: ${s.arm} cannoni`);
}
function repair(id){
 const s=S.ships.find(x=>x.id===id),c=Math.ceil((100-hp(s))*3);
 if(blocked(s.city))return toast(blkMsg(s.city));
 if(c<=0)return toast('Scafo integro');
 if(S.gold<c)return toast('Ducati insufficienti');
 S.gold-=c;s.hp=100;done(`Scafo riparato per ${c} ₯`);
}
function smuggle(id){
 const s=S.ships.find(x=>x.id===id),c=s.city;
 if(!blocked(c))return;
 if(!tot(s.cargo))return toast('Nave vuota: niente da contrabbandare');
 if(Math.random()<Math.max(.08,.4-.04*(s.wp||0)-.03*(s.arm||0))){
  if(strength(s)>=8+Math.random()*10){
   s.hp=Math.max(1,hp(s)-10);S.log.unshift(`Giorno ${S.day}: la ${s.name} respinge una pattuglia a ${c}.`);toast('Pattuglia respinta! Il contrabbando prosegue');
  }else{
   const lost=loseShare(s,.4);
   s.hp=hp(s)-30;S.pop[c]=(S.pop[c]||0)-10;
   S.log.unshift(`Giorno ${S.day}: la pattuglia di ${c} intercetta la ${s.name}: perse ${lost} merci.`);
   if(s.hp<=0){sink(s);return done('La nave è stata affondata dalla pattuglia')}
   return done(`Intercettati! Perse ${lost} merci e 30 di scafo`);
  }
 }
 let rev=0,n=0;
 for(let i=0;i<G.length;i++)while(s.cargo[i]>0){const p=Math.floor(sp(c,i)*1.4);rev+=p;S.gold+=p;S.mk[c][i]++;s.cargo[i]--;n++}
 s.cost=G.map(()=>0);
 S.pop[c]=(S.pop[c]||0)-2;
 done(`Contrabbando: venduti ${n} pezzi per ${fmt(rev)} ₯`);
}
function breakSiege(id){
 const s=S.ships.find(x=>x.id===id),c=s.city;
 if(blockReason(c)!=='assedio')return toast('Il porto non è sotto assedio');
 if(!tot(s.cargo))return toast('Serve un carico di rifornimenti');
 if(Math.random()<Math.min(.9,.35+.07*(s.arm||0)+.05*(s.wp||0))){
  let rev=0,n=0;
  for(let i=0;i<G.length;i++)while(s.cargo[i]>0){const p=Math.floor(sp(c,i)*1.5);rev+=p;S.gold+=p;S.mk[c][i]++;s.cargo[i]--;n++}
  s.cost=G.map(()=>0);
  S.pop[c]=Math.min(100,(S.pop[c]||0)+25);S.sat[c]=Math.min(100,S.sat[c]+15);
  S.log.unshift(`Giorno ${S.day}: la ${s.name} forza il blocco di ${c} e consegna ${n} pezzi: popolarità alle stelle.`);
  done(`Blocco forzato! Incassi ${fmt(rev)} ₯ e +25 popolarità`);
 }else{
  const lost=loseShare(s,.3);
  s.hp=hp(s)-30;
  S.log.unshift(`Giorno ${S.day}: la ${s.name} fallisce il forzamento del blocco di ${c}: perse ${lost} merci.`);
  if(s.hp<=0){sink(s);return done('La nave è affondata nel tentativo')}
  done(`Tentativo fallito: perse ${lost} merci e 30 di scafo`);
 }
}
function payFine(c){
 const cost=Math.round(500-(S.pop[c]||0)*60);
 if(facOf(S.ui.city)!=='N')return toast('Serve una città neutrale');
 if(S.gold<cost)return toast('Ducati insufficienti');
 S.gold-=cost;S.pop[c]=0;
 S.log.unshift(`Giorno ${S.day}: paghi ${fmt(cost)} ₯ di ammenda: a ${c} non sei più ricercato.`);
 done(`Ammenda pagata: ${c} è di nuovo aperta`);
}
function mediate(k){
 const [a,b]=k.split('|');
 if(S.rank<NEED_MED)return toast(`Serve il titolo di ${RANKS[NEED_MED][0]}`);
 if(infl(a)<30||infl(b)<30)return toast('Non sei abbastanza influente presso entrambe le fazioni');
 if(S.gold<15000)return toast('Ducati insufficienti');
 S.gold-=15000;delete S.war[k];
 for(const f of [a,b]){const cs=Object.keys(C).filter(c=>facOf(c)===f).sort((x,y)=>(S.pop[y]||0)-(S.pop[x]||0));S.pop[cs[0]]=Math.min(100,(S.pop[cs[0]]||0)+10)}
 S.log.unshift(`Giorno ${S.day}: fai da mediatore e firmi la pace tra ${FAC[a]} e ${FAC[b]}.`);
 done('Pace firmata: i porti riaprono, popolarità +10');
}
function toggleNeutral(){
 if(S.gold<5000)return toast('Ducati insufficienti');
 S.gold-=5000;S.neutral=!S.neutral;
 S.log.unshift(`Giorno ${S.day}: ${S.neutral?'diventi mercante neutrale':'riprendi la cittadinanza'}.`);
 done(S.neutral?'Ora sei un mercante neutrale':'Hai ripreso la cittadinanza');
}
function loan(n){
 if(n>0){if(S.debt+n>lim())return toast('Limite di credito raggiunto');S.gold+=n;S.debt+=n}
 else{const m=Math.min(-n,S.debt,Math.floor(S.gold));if(m<=0)return toast('Niente da rimborsare');S.gold-=m;S.debt-=m}
 done();
}

const price=(c,i)=>BASE[i]*Math.min(2.5,Math.max(.5,Math.pow(refOf(c,i)/(S.mk[c][i]+1),.7)));
const pf=c=>Math.max(-.1,Math.min(.1,((S.pop&&S.pop[c])||0)/1000))-(S.neutral?.03:0);
const bp=(c,i)=>Math.ceil(price(c,i)*(1-pf(c)));
const tr=(c,i)=>{const p=S.pp&&S.pp[c]?S.pp[c][i]:price(c,i),n=price(c,i);return n>p*1.01?'▲':n<p*.99?'▼':'–'};
const sp=(c,i)=>Math.max(1,Math.floor(price(c,i)*.9*(1+pf(c))));

function curShip(){
 const u=S.ui;
 if(u.store==='D'&&S.wh[u.city]<=0){const d=S.ships.find(x=>x.city===u.city&&!x.dest);if(d)u.store=d.id}
 if(u.store==='D')return null;
 const sh=S.ships.find(s=>s.id===u.store&&s.city===u.city&&!s.dest);
 if(!sh)u.store='D';
 return sh||null;
}
function qty(){return S.ui.qty==='max'?9999:S.ui.qty}
function buy(i){
 if(blocked(S.ui.city))return toast(blkMsg(S.ui.city));
 const c=S.ui.city,sh=curShip(),arr=sh?sh.cargo:S.dep[c],g0=S.gold,ca=sh?cb(sh):dc(c);let k=0;
 if(!sh&&S.wh[c]<=0)return toast('Qui non hai un deposito: commercia dalla nave');
 while(k<qty()){const p=bp(c,i);if(S.gold<p||S.mk[c][i]<1||(sh&&tot(arr)>=T[sh.type].cap)||(!sh&&tot(arr)>=S.wh[c]))break;S.gold-=p;S.mk[c][i]--;arr[i]++;ca[i]+=p;k++}
 S.pop[c]=Math.min(100,(S.pop[c]||0)+k*.02);
 done(k?`Comprati ${k} ${G[i]} per ${fmt(g0-S.gold)} ₯ (media ${((g0-S.gold)/k).toFixed(1)} ₯)`:'Non puoi comprare: ducati, spazio (nave o deposito) o scorte insufficienti');
}
function sell(i){
 if(blocked(S.ui.city))return toast(blkMsg(S.ui.city));
 const c=S.ui.city,sh=curShip(),arr=sh?sh.cargo:S.dep[c],g0=S.gold,ca=sh?cb(sh):dc(c);let k=0,co=0;
 if(!sh&&S.wh[c]<=0)return toast('Qui non hai un deposito: commercia dalla nave');
 while(k<qty()&&arr[i]>0){const a=ca[i]/arr[i];co+=a;ca[i]=Math.max(0,ca[i]-a);S.gold+=sp(c,i);S.mk[c][i]++;arr[i]--;k++}
 S.pop[c]=Math.min(100,(S.pop[c]||0)+k*.02);
 done(k?`Venduti ${k} ${G[i]} per ${fmt(S.gold-g0)} ₯ (costo medio ${(co/k).toFixed(1)} ₯, utile ${S.gold-g0-co>=0?'+':'−'}${fmt(Math.abs(S.gold-g0-co))} ₯)`:'Niente da vendere');
}
function move(i,dir){
 if(blocked(S.ui.city))return toast(blkMsg(S.ui.city));
 const sh=curShip();if(!sh)return;
 const m=xfer(sh,i,dir,qty());
 done(m?`Spostati ${m} ${G[i]}`:'Nulla da spostare');
}
function sailTo(id,d){
 const s=S.ships.find(x=>x.id===id);
 if(!s||s.dest)return toast('La nave non è libera');
 if(s.city===d)return toast('La nave è già in questo porto');
 const n=days(s.city,d,s);
 s.dest=d;s.route=null;s.wait=false;s.next=null;s.st=S.day;s.arr=S.day+n;
 S.log.unshift(`Giorno ${S.day}: la ${s.name} salpa da ${s.city} per ${d} (${n} giorni).`);
 done(`${s.name} in rotta per ${d}: ${gg(n)}`);
}
function sail(id){sailTo(id,$('#d'+id).value)}
function mapPick(c){
 S.ui.mapSel=c;
 const fr=S.ships.filter(s=>!s.dest&&s.city!==c);
 S.ui.mapShip=fr.length===1?fr[0].id:null;
 done();mapCenter(c);
}
function mapShipPick(id){S.ui.mapShip=id;done()}
function mapGo(){const id=S.ui.mapShip;S.ui.mapShip=null;sailTo(id,S.ui.mapSel)}
function mapZoom(d){S.ui.mz=Math.max(1,Math.min(4,(S.ui.mz||2)+d));done()}
function mapOpen(){S.ui.city=S.ui.mapSel;go('porto')}
function mapCenterXY(x,y){
 const mb=document.getElementById('mapbox');if(!mb)return;
 mb.scrollLeft=x/MAPW*mb.scrollWidth-mb.clientWidth/2;
 mb.scrollTop=y/MAPH*mb.scrollHeight-mb.clientHeight/2;
 mapScroll=[mb.scrollLeft,mb.scrollTop];
}
function mapCenter(c){if(c&&PXY[c])mapCenterXY(PXY[c][0],PXY[c][1])}
function mapFocus(id){
 const s=S.ships.find(x=>x.id===id);if(!s)return;
 let pt=PXY[s.city];
 if(s.dest)pt=along(routeXY(s.city,s.dest),progOf(s));
 if(S.ui.tab==='mappa'){done();mapCenterXY(pt[0],pt[1])}else{mapFocusPt=pt;go('mappa')}
}
function buyShip(t){
 const c=S.ui.city,T0=T[t];
 if(blocked(c))return toast(blkMsg(c));
 if(S.gold<T0.cost)return toast('Ducati insufficienti');
 S.gold-=T0.cost;
 const nm=NAMES[S.nid%NAMES.length];
 S.ships.push({id:S.nid++,name:nm,type:t,city:c,dest:null,arr:0,st:0,arm:0,cargo:G.map(()=>0)});
 S.log.unshift(`Giorno ${S.day}: acquistata la ${nm} (${t}) a ${c}.`);
 done('Nave acquistata a '+c);
}
function sellShip(id){
 const s=S.ships.find(x=>x.id===id);
 if(blocked(s.city))return toast(blkMsg(s.city));
 if(tot(s.cargo))return toast('Scarica prima la nave');
 S.gold+=T[s.type].cost*.5;S.ships=S.ships.filter(x=>x.id!==id);
 done('Nave venduta');
}
function mktDay(cs){
 let msg='';const sn=seas();
 for(const c of cs){
  const m=S.mk[c];
  for(const i of C[c][3])m[i]+=RATE[c][i]*SEAS[i][sn]*(.9+Math.random()*.2);
  for(const i of C[c][4]){const rc=IND[i];let cy=RATE[c][i]*(.9+Math.random()*.2);for(const j in rc.in)cy=Math.min(cy,m[j]/rc.in[j]);cy=Math.max(0,cy);for(const j in rc.in)m[j]-=cy*rc.in[j];m[i]+=cy}
  let num=0,den=0;
  for(let i=0;i<G.length;i++){
   const n=cons(c,i);
   if(n>0){num+=SATW[i]*Math.min(1,m[i]/n);den+=SATW[i];m[i]=Math.max(0,m[i]-n)}
   const rf=refOf(c,i)*2.5;if(m[i]>rf)m[i]-=(m[i]-rf)*.035;
  }
  const t=Math.min(100,100*num/Math.max(den,.01)+S.pros[c]/10);
  S.sat[c]+=(t-S.sat[c])*.08;
  S.popu[c]=Math.min(C[c][5]*3,Math.max(C[c][5]*.5,S.popu[c]*(1+(S.sat[c]-55)/45*.0004)));
  if(S.sat[c]<25&&!S.crisis[c]){S.crisis[c]=true;msg=`Crisi a ${c}: fame e malcontento`;S.log.unshift(`Giorno ${S.day}: crisi a ${c}: scarseggiano i beni di prima necessità.`)}
  else if(S.sat[c]>45)S.crisis[c]=false;
 }
 for(let k=0;k<20;k++){
  const i=Math.floor(Math.random()*G.length),pool=[rnd(cs),rnd(cs),rnd(cs),rnd(cs),rnd(cs)],r=c=>S.mk[c][i]/refOf(c,i);
  pool.sort((a,b)=>r(b)-r(a));
  const a=pool[0],b=pool[4];
  if(a!==b&&r(a)>1.4&&r(b)<.9&&!((S.siege[b]||0)>S.day)){const q=Math.min((S.mk[a][i]-refOf(a,i))*.35,50);if(q>1){S.mk[a][i]-=q;S.mk[b][i]+=q*.9}}
 }
 return msg;
}
function adv(n){

  if(S.day%7===0)for(const c in S.wh){const o=S.own[c]||0,l=S.lea[c]||0;S.gold-=Math.max(0,S.wh[c]-(o-l))/250*50;if(!blocked(c))S.gold+=l/250*70*(1+(S.pros[c]||0)/100)}

  }

};

 ${S.bld.map((b,i)=>`<div class="card"><div class="r"><b>${G[b.good]} · ${b.city}</b><span class="m">Livello ${b.lv}/5</span></div><small>${(3*b.lv*(C[b.city][3].includes(b.good)?1.5:1)).toFixed(1)} unità al giorno${S.wh[b.city]?'':' · nessun deposito in questa città!'}</small>${b.lv<5?`<div class="b"><button onclick="upgrade(${i})">Potenzia (1.000 ₯)</button></div>`:''}</div>`).join('')}
 <h2>Rotte automatiche</h2><small>La nave vende tutto il carico, compra la merce scelta per quel porto e riparte per l’altro porto.</small><div style="height:8px"></div>
 ${S.ships.map(s=>{const r=s.route;return `<div class="card"><div class="r"><b>${s.name}</b><span class="m">${s.type}</span></div>`+(r?`<small>${r.a} (compra ${r.ga>=0?G[r.ga]:'niente'}) ⇄ ${r.b} (compra ${r.gb>=0?G[r.gb]:'niente'})</small><div class="b"><button onclick="stopRoute(${s.id})">Ferma rotta</button></div>`:`<small>Porto A e merce da comprare lì; porto B e merce da comprare lì.</small><select id="ra${s.id}">${co(s.city)}</select><select id="rga${s.id}">${gs}</select><select id="rb${s.id}">${co('')}</select><select id="rgb${s.id}">${gs}</select><div class="b"><button onclick="setRoute(${s.id})">Avvia rotta</button></div>`)+`</div>`}).join('')||'<p>Nessuna nave.</p>'}`;
},
diario(){
 return `<h2>Diario</h2><div class="card"><div class="r"><span>Mercante</span><b>${S.name}</b></div><div class="r"><span>Titolo</span><b>${RANKS[S.rank][0]}</b></div>${RANKS[S.rank+1]?`<small>Prossimo titolo, ${RANKS[S.rank+1][0]}: patrimonio ${fmt(RANKS[S.rank+1][1])} ₯</small>`:''}<div class="r"><span>Città d’origine</span><b>${S.home}</b></div><div class="r"><span>Ducati</span><b>${fmt(S.gold)} ₯</b></div><div class="r"><span>Patrimonio stimato</span><b>${fmt(worth())} ₯</b></div><small>Include navi (metà del prezzo), merci, depositi, meno i debiti; i magazzini di tua proprietà contano.</small></div>
 <div class="card"><div class="r"><b>Banca</b><span class="m">Debito ${fmt(S.debt)} ₯ · limite ${fmt(lim())} ₯</span></div><small>Interesse 0,1% al giorno. Il limite cresce con il titolo.</small><div class="b"><button onclick="loan(500)">Prendi 500 ₯</button><button onclick="loan(5000)">Prendi 5.000 ₯</button><button onclick="loan(50000)">Prendi 50.000 ₯</button></div><div class="b"><button onclick="loan(-500)">Rimborsa 500 ₯</button><button onclick="loan(-5000)">Rimborsa 5.000 ₯</button><button onclick="loan(-1e9)">Rimborsa tutto</button></div></div>${neutCard()}<div class="card log">${S.log.map(l=>`<p>${l}</p>`).join('')}</div>
 <div class="b"><button onclick="if(confirm('Cancellare la partita e ricominciare?')){speed=0;acc=0;init();done('Nuova partita')}">Nuova partita</button></div>`;
}
};
function renderTop(){$('#top').innerHTML=S.started?`<span>Giorno ${S.day}</span><span>${fmt(S.gold)} ₯</span>`:'<span>Mercanti del Mediterraneo</span>';$('#sub').innerHTML=S.started?`${S.name}, ${RANKS[S.rank][0]}${S.debt?' · debito '+fmt(S.debt)+' ₯':''} · ${SN[seas()]}${Object.keys(S.war).length?' · ⚔ guerra':''}`:''}
function renderSpeed(){
 $('#spd').innerHTML=[['Pausa',0],['1X',1],['2X',2],['4X',4]].map(([l,v])=>`<button class="${speed===v?'on':''}" onclick="setSpeed(${v})">${l}</button>`).join('');
}
function render(keep){
 const u=S.ui;
 document.body.classList.toggle('start',!S.started);
 renderTop();renderSpeed();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===u.tab));
 const sv=[...document.querySelectorAll('#main select')].map(s=>s.value);
 const mb=document.getElementById('mapbox');if(mb)mapScroll=[mb.scrollLeft,mb.scrollTop];
 $('#main').innerHTML=S.started?P[u.tab]():P.inizio();
 const mb2=document.getElementById('mapbox');if(mb2){if(mapScroll===null){if(mapFocusPt){mapCenterXY(mapFocusPt[0],mapFocusPt[1]);mapFocusPt=null}else mapCenter(S.ui.mapSel||(S.ships[0]&&S.ships[0].city)||S.home)}else{mb2.scrollLeft=mapScroll[0];mb2.scrollTop=mapScroll[1]}}
 if(keep)[...document.querySelectorAll('#main select')].forEach((s,i)=>{if(sv[i]!==undefined&&[...s.options].some(o=>o.value===sv[i]||o.text===sv[i]))s.value=sv[i]});
}
render();
</script>
</body>
</html>
