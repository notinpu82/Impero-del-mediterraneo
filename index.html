<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercanti del Mediterraneo</title>
<style>
:root{--bg:#0e1b26;--card:#162a3a;--ink:#e8eef2;--mut:#8fa6b6;--gold:#e0b252;--line:#27465c;--ok:#6fcf97;--bad:#f2837a;--btn:#21465f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:122px 10px 74px}
body.start{padding-top:56px;padding-bottom:20px}
body.start nav,body.start .days{display:none}
h2{font:600 20px Georgia,serif;margin:6px 0 10px;color:var(--gold)}
header{position:fixed;top:0;left:0;right:0;background:#0a141c;border-bottom:1px solid var(--line);padding:8px 12px;z-index:5}
#top{font:600 17px Georgia,serif;color:var(--gold);display:flex;justify-content:space-between;gap:8px}
.days{display:flex;gap:6px;margin-top:6px}
.days button{flex:1;padding:7px 4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a141c;border-top:1px solid var(--line);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 0;font-size:11px;border-radius:0}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
button,select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button:active{background:var(--line)}
button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
select{width:100%;margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b button{flex:1;min-width:84px}
small,.m{color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.lo{color:var(--ok);font-weight:700}.hi{color:var(--bad);font-weight:700}
#toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:9;max-width:90%;text-align:center;pointer-events:none}
.log p{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
input{font:inherit;width:100%;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 10px}#bar{height:3px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--gold)}#sub{font-size:12px;color:var(--mut)}body.start #bar,body.start #sub{display:none}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px}.pb i{display:block;height:100%;background:var(--gold)}button:disabled{opacity:.5}
</style>
</head>
<body>
<header><div id="top"></div><div id="sub"></div><div class="days" id="spd"></div><div id="bar"><i></i></div></header>
<main id="main"></main>
<div id="toast"></div>
<nav>
<button data-t="porto" onclick="go('porto')">Porto</button>
<button data-t="navi" onclick="go('navi')">Navi</button>
<button data-t="mercati" onclick="go('mercati')">Mercati</button>
<button data-t="cantiere" onclick="go('cantiere')">Cantiere</button>
<button data-t="imprese" onclick="go('imprese')">Imprese</button>
<button data-t="citta" onclick="go('citta')">Città</button>
<button data-t="diario" onclick="go('diario')">Diario</button>
</nav>
<script>
const G=['Grano','Sale','Legname','Vino','Ferro','Vetro','Seta','Spezie','Olio','Pesce salato','Lana','Panni','Cera','Allume','Zucchero','Pelli'];
const BASE=[10,14,18,24,32,40,90,130,22,12,28,55,35,60,70,20];
// città: [stato, x, y, materie prime prodotte, industrie (beni finiti), abitanti in migliaia, fazione]
const C={
'Venezia':['Repubblica di Venezia',12.3,45.4,[1,9],[5],40,'Venezia'],
'Genova':['Repubblica di Genova',8.9,44.4,[2,8],[11],35,'Genova'],
'Pisa':['Repubblica di Pisa',10.4,43.7,[2,8,10],[],20,'Pisa'],
'Amalfi':['Ducato di Amalfi',14.6,40.6,[3,8,12],[],12,'Amalfi'],
'Ragusa':['Repubblica di Ragusa',18.1,42.6,[4,15,9],[],10,'Ragusa'],
'Palermo':['Regno di Sicilia',13.4,38.1,[0,1,14],[],25,'Sicilia'],
'Marsiglia':['Contea di Provenza',5.4,43.3,[9,1,3],[5],18,'Provenza'],
'Barcellona':['Corona d’Aragona',2.2,41.4,[10,8,3,2],[11],22,'Aragona'],
'Valencia':['Corona d’Aragona',-0.4,39.5,[14,8,0],[],16,'Aragona'],
'Algeri':['Emirato hafside',3.1,36.8,[10,15,12],[],12,'Hafsidi'],
'Tunisi':['Emirato hafside',10.2,36.8,[1,8,0,10],[],18,'Hafsidi'],
'Salonicco':['Impero bizantino',22.9,40.6,[0,12,15,4],[],15,'Bizantino'],
'Costantinopoli':['Impero bizantino',29,41,[6,0,9,12],[11,5],60,'Bizantino'],
'Candia':['Dominio veneziano',25.1,35.3,[3,8],[],8,'Venezia'],
'Caffa':['Colonia genovese',35.4,45,[9,15,12,0,2],[],12,'Genova'],
'Famagosta':['Regno di Cipro',33.9,35.1,[14,1,8,13],[],10,'Cipro'],
'Acri':['Regno di Gerusalemme',35.1,32.9,[7,6,14],[],14,'Gerusalemme'],
'Alessandria':['Sultanato mamelucco',29.9,31.2,[7,14,13,0],[],40,'Mamelucco'],
'Zara':['Dominio veneziano',15.2,44.1,[9,2],[],8,'Venezia'],
'Chio':['Colonia genovese',26.1,38.4,[3,8],[],8,'Genova'],
'Cagliari':['Giudicato pisano',9.1,39.2,[1,4,15],[],8,'Pisa'],
'Gaeta':['Ducato di Gaeta',13.6,41.2,[8,0,9],[],8,'Amalfi'],
'Spalato':['Repubblica di Ragusa',16.4,43.5,[3,9,2],[],8,'Ragusa'],
'Messina':['Regno di Sicilia',15.6,38.2,[6,8,9],[],18,'Sicilia'],
'Aigues-Mortes':['Contea di Provenza',4.2,43.6,[1,9],[],6,'Provenza'],
'Palma':['Corona d’Aragona',2.7,39.6,[1,8,3],[],10,'Aragona'],
'Tripoli':['Emirato hafside',13.2,32.9,[8,15],[],12,'Hafsidi'],
'Monemvasia':['Impero bizantino',23.1,36.7,[3,8,9],[],6,'Bizantino'],
'Limassol':['Regno di Cipro',33,34.7,[3,14,1],[],6,'Cipro'],
'Beirut':['Regno di Gerusalemme',35.5,33.9,[6,8,14],[],10,'Gerusalemme'],
'Damietta':['Sultanato mamelucco',31.8,31.4,[0,9,14],[],14,'Mamelucco'],
'Ancona':['Libero comune di Ancona',13.5,43.6,[9,0,15],[],10,'N'],
'Orano':['Regno di Tlemcen',-.6,35.7,[10,15,0],[],8,'N'],
'Rodi':['Ordine di San Giovanni',28.2,36.4,[3,9,8],[],6,'N'],
'Trebisonda':['Impero di Trebisonda',39.7,41,[6,12,15],[],14,'N'],
'Corfù':['Despotato d’Epiro',19.9,39.6,[8,1,3],[],6,'N']
};
const FAC={Venezia:'Repubblica di Venezia',Genova:'Repubblica di Genova',Pisa:'Repubblica di Pisa',Amalfi:'Ducato di Amalfi',Ragusa:'Repubblica di Ragusa',Sicilia:'Regno di Sicilia',Provenza:'Contea di Provenza',Aragona:'Corona d’Aragona',Hafsidi:'Emirato hafside',Bizantino:'Impero bizantino',Cipro:'Regno di Cipro',Gerusalemme:'Regno di Gerusalemme',Mamelucco:'Sultanato mamelucco',N:'Città neutrali'};
// industrie: bene finito <- materie prime consumate per unità prodotta
const IND={5:{in:{2:1,1:.5}},11:{in:{10:2,13:.3}}};
// consumi giornalieri per 1000 abitanti: poveri, benestanti, ricchi
const SH=[.6,.3,.1],K=.1;
const NEED=[
 {0:7,9:4,1:1,2:1.5,15:.3},
 {0:4,9:1.5,3:3,8:2,10:1.5,2:1.5,1:.8,4:.5,15:.5,11:1.2,12:.5,14:1,7:.6,5:.6,6:.3},
 {3:4,8:2.5,11:4,6:3.6,7:4.5,5:3.6,14:4.5,12:3,0:1.5,9:.5,4:.5}];
const consAt=(pk,i)=>{let t=0;for(let k=0;k<3;k++)t+=pk*SH[k]*(NEED[k][i]||0)*K;return t};
// calibrazione iniziale: la produzione mondiale supera del 20% il consumo, ripartita tra i produttori in base agli abitanti
const RATE={};
(()=>{
 const cs=Object.keys(C),tot=G.map((g,i)=>cs.reduce((n,c)=>n+consAt(C[c][5],i),0));
 for(const c of cs)RATE[c]=G.map(()=>0);
 for(const i in IND){
  const pr=cs.filter(c=>C[c][4].includes(+i)),w=pr.reduce((n,c)=>n+C[c][5],0),o=tot[i]*1.2;
  for(const c of pr)RATE[c][i]=o*C[c][5]/w;
  for(const j in IND[i].in)tot[j]+=o*IND[i].in[j];
 }
 G.forEach((g,i)=>{
  const pr=cs.filter(c=>C[c][3].includes(i)),w=pr.reduce((n,c)=>n+C[c][5],0);
  for(const c of pr)RATE[c][i]=tot[i]*1.2*C[c][5]/w;
 });
})();
const T={'Cocca':{cap:60,v:180,cost:900},'Galea':{cap:110,v:252,cost:2000},'Nave tonda':{cap:220,v:198,cost:4200}};
const NAMES=['San Marco','Stella Maris','Leone Alato','Sant’Elena','Fortuna','Aquila','Santa Chiara','Gabbiano','Tramontana','Libeccio','Sirena','Delfino'];
const RANKS=[['Venditore ambulante',0],['Bottegaio',25000],['Mercante',60000],['Armatore',150000],['Patrizio',350000],['Consigliere',800000],['Console',1800000],['Doge',4000000]];
const KEY='mercanti_med_v5';
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('it-IT');
const tot=a=>a.reduce((x,y)=>x+y,0);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let S,speed=0,acc=0;
const CIV=[
['Pozzo pubblico',600,0,4,2,0,'Acqua pulita per il quartiere.'],
['Cappella',1500,5,8,3,0,'Un piccolo luogo sacro.'],
['Ospedale',2500,10,10,5,0,'Cura i poveri e i pellegrini.'],
['Mercato coperto',3000,15,6,8,8,'Attira commerci e botteghe.'],
['Chiesa',5000,20,15,6,0,'Cuore religioso della città.'],
['Fontana monumentale',4000,25,12,6,0,'Orgoglio dei cittadini.'],
['Palazzo cittadino',9000,30,10,10,20,'La tua residenza e sede d’affari.'],
['Monumento',12000,40,20,8,10,'Statua e arco trionfale: attirano visitatori.'],
['Cattedrale',20000,45,30,15,25,'Meta di pellegrini da tutta la regione.']];
const SEAS=[[.8,1.4,1.2,.9],[.9,1.4,1.1,.8],[1,.9,1,1.3],[.8,.9,1.5,1.1],[1,1.1,1,.9],[1,.9,1,1.1],[1.3,1.1,.8,.8],[.9,1.2,1.1,.8],[.8,.8,1.1,1.5],[1.1,1.2,.9,.7],[1.4,1.1,.9,.7],[1.1,1.2,.9,.7],[.9,1.3,1,.8],[1,1,1,1],[.9,.9,1.4,1.2],[.9,.9,1.3,1.1]];
const SN=['Primavera','Estate','Autunno','Inverno'];
const seas=()=>Math.floor(((S.day-1)%360)/90);
const WIN=[2,8,10,11,15],SATW=[3,1,1,1,.5,.3,.3,.3,1,2,.5,.5,.3,0,.3,.5];
const cons=(c,i)=>consAt(S.popu[c],i)*(seas()===3&&WIN.includes(i)?1.3:1);
const refOf=(c,i)=>consAt(S.popu[c],i)*10+25;
const inDem=(c,j)=>C[c][4].reduce((n,i)=>n+RATE[c][i]*(IND[i].in[j]||0),0);
const prodTxt=c=>[...C[c][3],...C[c][4]].map(i=>G[i]).join(', ');
const needTxt=c=>{const l=G.map((g,i)=>[i,consAt(S.popu[c]||C[c][5],i)+inDem(c,i)-RATE[c][i]]).filter(x=>x[1]>.3).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>G[x[0]]);return l.join(', ')||'—'};
const seasonInfo=()=>{const s=seas(),ab=G.filter((g,i)=>SEAS[i][s]>=1.25),sc=G.filter((g,i)=>SEAS[i][s]<=.8);return `<div class="card"><b>${SN[s]}</b> · giorno ${((S.day-1)%90)+1} di 90<br><small>Raccolto abbondante: ${ab.join(', ')||'—'}<br>Raccolto scarso: ${sc.join(', ')||'—'}</small></div>`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function init(){
 S={started:false,name:'',home:'',day:1,gold:1500,debt:0,rank:0,bld:[],nid:1,ships:[],dep:{},wh:{},mk:{},pop:{},pros:{},civ:{},pp:{},popu:{},sat:{},crisis:{},own:{},lea:{},war:{},siege:{},neutral:false,depc:{},log:[],ui:{tab:'porto',city:'Venezia',store:'D',qty:10}};
 for(const c in C){S.pop[c]=0;S.pros[c]=0;S.civ[c]=[];S.dep[c]=G.map(()=>0);S.wh[c]=0;S.own[c]=0;S.lea[c]=0;S.popu[c]=C[c][5];S.sat[c]=60;S.mk[c]=G.map((g,i)=>(RATE[c][i]>0?1.6:.7)*refOf(c,i))}
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.ships)init();
if(!S.bld)S.bld=[];
if(!S.pop){S.pop={};S.pros={};S.civ={};for(const c in C){S.pop[c]=0;S.pros[c]=0;S.civ[c]=[]}}
if(!S.pp)S.pp={};
if(!S.depc)S.depc={};
if(!S.own){S.own={};S.lea={};for(const c in C){S.own[c]=0;S.lea[c]=0}}
for(const c in S.wh)if(S.wh[c]>0)S.wh[c]=Math.ceil(S.wh[c]/250)*250;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.opacity=0,2200)}
function done(m){save();render();if(m)toast(m)}
function go(t){S.ui.tab=t;done();scrollTo(0,0)}
function setQ(x){S.ui.qty=x;done()}
function setSpeed(n){speed=n;renderSpeed()}
function start(c){
 S.name=esc(($('#nm').value||'').trim().slice(0,24))||'Mercante';
 S.started=true;S.home=c;S.neutral=C[c][6]==='N';S.ui.city=c;S.pop[c]=10;acc=0;
 S.ships.push({id:S.nid++,name:'Santa Lucia',type:'Cocca',city:c,dest:null,arr:0,st:0,arm:0,cargo:G.map(()=>0)});
 S.log.unshift(`Giorno 1: ${S.name} inizia la sua avventura da ${c}.`);
 done();scrollTo(0,0);
}
const LIM=[3000,15000,40000,100000,250000,600000,1200000,2500000];
const lim=()=>LIM[S.rank];
const NEED_RANK=3,NEED_POP=25,NEED_BUY=2;
const can=c=>c===S.home||(S.rank>=NEED_RANK&&(S.pop[c]||0)>=NEED_POP);
const need=c=>`Per costruire a ${c} serve il titolo di ${RANKS[NEED_RANK][0]} e popolarità ${NEED_POP} in città (ora ${(S.pop[c]||0).toFixed(1)}).`;
const facOf=c=>C[c][6];
const myFac=()=>S.neutral?'N':facOf(S.home);
const wk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const atWar=(a,b)=>a!==b&&a!=='N'&&b!=='N'&&(S.war[wk(a,b)]||0)>S.day;
const blockReason=c=>{
 if(!S.started)return '';
 if((S.siege[c]||0)>S.day)return 'assedio';
 if((S.pop[c]||0)<-30)return 'reputazione';
 if(atWar(myFac(),facOf(c)))return 'guerra';
 return '';
};
const BLK={assedio:'la città è assediata',reputazione:'sei un ricercato in questa città',guerra:'la tua fazione è in guerra con questa città'};
const blocked=c=>!!blockReason(c);
const blkMsg=c=>`Porto di ${c} bloccato: ${BLK[blockReason(c)]}.`;
const hp=s=>s.hp===undefined?100:s.hp;
const strength=s=>(s.arm||0)*3+(s.wp||0)*2+hp(s)/20;
const infl=f=>Math.max(-100,...Object.keys(C).filter(c=>facOf(c)===f).map(c=>S.pop[c]||0));
const NEED_MED=6;
const RIV=[['Venezia','Genova',4],['Genova','Pisa',3],['Aragona','Genova',2],['Venezia','Bizantino',2],['Venezia','Ragusa',1.5],['Pisa','Amalfi',1],['Aragona','Hafsidi',3],['Gerusalemme','Mamelucco',4],['Cipro','Mamelucco',3],['Bizantino','Mamelucco',1.5],['Sicilia','Hafsidi',2],['Provenza','Aragona',1],['Genova','Bizantino',1],['Amalfi','Sicilia',1],['Pisa','Hafsidi',1],['Venezia','Mamelucco',.5]];
const cb=s=>s.cost||(s.cost=G.map(()=>0));
const dc=c=>S.depc[c]||(S.depc[c]=G.map(()=>0));
const avgOf=(cost,q)=>q>0?cost/q:0;
function loseShare(s,f){let lost=0;const old=s.cargo.slice(),cs=cb(s);s.cargo=s.cargo.map(q=>{const l=Math.floor(q*f);lost+=l;return q-l});cs.forEach((v,i)=>{if(old[i])cs[i]=v*s.cargo[i]/old[i]});return lost}
function sink(s){S.ships=S.ships.filter(x=>x!==s);S.log.unshift(`Giorno ${S.day}: la ${s.name} è affondata con il suo carico.`)}
function autoStep(s){
 const r=s.route,c=s.city;
 if(c!==r.a&&c!==r.b){if(blocked(r.a)){s.wait=true;s.next=r.a;return}s.dest=r.a;s.st=S.day;s.arr=S.day+days(c,r.a,s);return}
 let sold=0;const g0=S.gold;
 for(let i=0;i<G.length;i++)while(s.cargo[i]>0){S.gold+=sp(c,i);S.mk[c][i]++;s.cargo[i]--;sold++}
 s.cost=G.map(()=>0);
 const rev=S.gold-g0,gi=c===r.a?r.ga:r.gb;let bought=0;
 if(gi>=0)while(tot(s.cargo)<T[s.type].cap){const p=bp(c,gi);if(S.gold<p||S.mk[c][gi]<1)break;S.gold-=p;S.mk[c][gi]--;s.cargo[gi]++;cb(s)[gi]+=p;bought++}
 S.pop[c]=Math.min(100,(S.pop[c]||0)+(sold+bought)*.02);
 const o=c===r.a?r.b:r.a;
 if(blocked(o)){s.wait=true;s.next=o}else{s.dest=o;s.st=S.day;s.arr=S.day+days(c,o,s)}
 S.log.unshift(`Giorno ${S.day}: rotta della ${s.name} a ${c}: venduti ${sold} pezzi per ${fmt(rev)} ₯, comprati ${bought}, poi verso ${o}${blocked(o)?' (bloccato: attende fuori dalle acque)':''}.`);
}
function setRoute(id){
 const s=S.ships.find(x=>x.id===id),v=k=>$('#'+k+id).value;
 const a=v('ra'),b=v('rb');
 if(a===b)return toast('Scegli due porti diversi');
 s.route={a,b,ga:+v('rga'),gb:+v('rgb')};
 if(!s.dest){if(blocked(s.city)){s.wait=true;s.next=null}else autoStep(s)}
 done('Rotta avviata per '+s.name);
}
function xfer(s,i,dir,n){
 const dep=S.dep[s.city],dcs=dc(s.city),scs=cb(s);let m;
 if(dir>0){m=Math.min(n,dep[i],T[s.type].cap-tot(s.cargo));const a=avgOf(dcs[i],dep[i]);dep[i]-=m;dcs[i]=Math.max(0,dcs[i]-a*m);s.cargo[i]+=m;scs[i]+=a*m}
 else{m=Math.max(0,Math.min(n,s.cargo[i],S.wh[s.city]-tot(dep)));const a=avgOf(scs[i],s.cargo[i]);s.cargo[i]-=m;scs[i]=Math.max(0,scs[i]-a*m);dep[i]+=m;dcs[i]+=a*m}
 return m;
}
function moveS(id,i,dir){
 const s=S.ships.find(x=>x.id===id);
 if(blocked(s.city))return toast(blkMsg(s.city));
 const m=xfer(s,i,dir,qty());
 done(m?`Spostati ${m} ${G[i]}`:(dir>0?'Nave piena o niente nel deposito':'Deposito pieno o niente da scaricare'));
}
function loadAll(id,dir){
 const s=S.ships.find(x=>x.id===id);let t=0;
 if(blocked(s.city))return toast(blkMsg(s.city));
 for(let i=0;i<G.length;i++)t+=xfer(s,i,dir,9999);
 done(t?`Spostate ${t} merci`:'Niente da spostare');
}
function donate(n){
 const c=S.ui.city;

function mktDay(cs){
 let msg='';const sn=seas();
 for(const c of cs){
  const m=S.mk[c];
  for(const i of C[c][3])m[i]+=RATE[c][i]*SEAS[i][sn]*(.9+Math.random()*.2);
  for(const i of C[c][4]){const rc=IND[i];let cy=RATE[c][i]*(.9+Math.random()*.2);for(const j in rc.in)cy=Math.min(cy,m[j]/rc.in[j]);cy=Math.max(0,cy);for(const j in rc.in)m[j]-=cy*rc.in[j];m[i]+=cy}
  let num=0,den=0;
  for(let i=0;i<G.length;i++){
   const n=cons(c,i);
   if(n>0){num+=SATW[i]*Math.min(1,m[i]/n);den+=SATW[i];m[i]=Math.max(0,m[i]-n)}
   const rf=refOf(c,i)*2.5;if(m[i]>rf)m[i]-=(m[i]-rf)*.035;
  }
  const t=Math.min(100,100*num/Math.max(den,.01)+S.pros[c]/10);
  S.sat[c]+=(t-S.sat[c])*.08;
  S.popu[c]=Math.min(C[c][5]*3,Math.max(C[c][5]*.5,S.popu[c]*(1+(S.sat[c]-55)/45*.0004)));
  if(S.sat[c]<25&&!S.crisis[c]){S.crisis[c]=true;msg=`Crisi a ${c}: fame e malcontento`;S.log.unshift(`Giorno ${S.day}: crisi a ${c}: scarseggiano i beni di prima necessità.`)}
  else if(S.sat[c]>45)S.crisis[c]=false;
 }
 for(let k=0;k<20;k++){
  const i=Math.floor(Math.random()*G.length),pool=[rnd(cs),rnd(cs),rnd(cs),rnd(cs),rnd(cs)],r=c=>S.mk[c][i]/refOf(c,i);
  pool.sort((a,b)=>r(b)-r(a));
  const a=pool[0],b=pool[4];
  if(a!==b&&r(a)>1.4&&r(b)<.9&&!((S.siege[b]||0)>S.day)){const q=Math.min((S.mk[a][i]-refOf(a,i))*.35,50);if(q>1){S.mk[a][i]-=q;S.mk[b][i]+=q*.9}}
 }
 return msg;
}
function adv(n){

  for(const s of S.ships)S.gold-=T[s.type].cap/30;
  if(S.day%7===0)for(const c in S.wh){const o=S.own[c]||0,l=S.lea[c]||0;S.gold-=Math.max(0,S.wh[c]-(o-l))/250*50;if(!blocked(c))S.gold+=l/250*70*(1+(S.pros[c]||0)/100)}
  for(const b of S.bld){S.gold-=3*b.lv;b.acc=(b.acc||0)+3*b.lv*(C[b.city][3].includes(b.good)?1.5:1);let q=Math.floor(b.acc);b.acc-=q;const d=S.dep[b.city],rc=IND[b.good];q=Math.max(0,Math.min(q,S.wh[b.city]-tot(d)));if(rc){for(const j in rc.in)q=Math.min(q,Math.floor(d[j]/rc.in[j]));if(q>0)for(const j in rc.in)d[j]-=q*rc.in[j]}d[b.good]+=q;dc(b.city)[b.good]+=q*BASE[b.good]*.5}
  for(const c in S.civ)if(!blocked(c))for(const x of S.civ[c])S.gold+=CIV[x][5]*(1+S.pros[c]/100);
  if(S.debt>0)S.debt=Math.round(S.debt*1001)/1000;

  for(const k in S.war)if(S.war[k]<=S.day){delete S.war[k];const [a,b]=k.split('|');msg=`Pace tra ${FAC[a]} e ${FAC[b]}`;S.log.unshift(`Giorno ${S.day}: pace tra ${FAC[a]} e ${FAC[b]}.`)}

   const ok=RIV.filter(r=>!S.war[wk(r[0],r[1])]),tw=ok.reduce((n,r)=>n+r[2],0);

    let x=Math.random()*tw,r=ok[0];for(const q of ok){x-=q[2];if(x<=0){r=q;break}}

    msg=`Guerra tra ${FAC[r[0]]} e ${FAC[r[1]]}!`;S.log.unshift(`Giorno ${S.day}: scoppia la guerra tra ${FAC[r[0]]} e ${FAC[r[1]]}.`);
   }
  }
  if(S.day>30&&Object.keys(S.siege).length<2&&Math.random()<.004){
   const c=rnd(cs);
   if(!S.siege[c]){S.siege[c]=S.day+15+Math.floor(Math.random()*35);msg=`Assedio a ${c}!`;S.log.unshift(`Giorno ${S.day}: ${c} è sotto assedio.`)}
  }
  if(Math.random()<.08){
   const c=rnd(cs),i=rnd(C[c][3]),up=Math.random()<.5;
   S.mk[c][i]*=up?1.8:.5;

  }

   if(s.next){if(!blockReason(s.next)){const o=s.next;s.wait=false;s.next=null;s.dest=o;s.st=S.day;s.arr=S.day+days(s.city,o,s)}}
   else if(!blockReason(s.city)){s.wait=false;autoStep(s)}
  }
  for(const s of S.ships.slice())if(s.dest&&S.day>=s.arr){

   if(s.route){if(br){s.wait=true;s.next=null}else autoStep(s)}
  }

 const cs=Object.keys(C),f=S.ui.city;
 const mm=G.map((g,i)=>{const v=cs.map(c=>bp(c,i));return[Math.min(...v),Math.max(...v)]});
 return `<h2>Mercati</h2>${seasonInfo()}<small>Prezzo di acquisto. Verde: il più basso, rosso: il più alto. Giorni di viaggio calcolati da:</small>${citySel()}
 <div class="tw"><table><tr><th>Città</th><th>Giorni</th>${G.map(g=>`<th>${g}</th>`).join('')}</tr>
 ${cs.map(c=>`<tr><td><b>${c}${blocked(c)?' ⛔':''}</b><br><small>${C[c][0]}</small></td><td>${c===f?'—':days(f,c,{type:'Cocca'})+' / '+days(f,c,{type:'Galea'})}</td>${G.map((g,i)=>{const p=bp(c,i);return `<td class="${p===mm[i][0]?'lo':p===mm[i][1]?'hi':''}">${p}</td>`}).join('')}</tr>`).join('')}
 </table></div><small>Vendendo ottieni circa il 90% del prezzo. Giorni: Cocca / Galea.</small>`;
},
cantiere(){
 const c=S.ui.city;
 return `<h2>Cantiere</h2><small>Acquisti la nave nel porto scelto:</small>${citySel()}
 ${Object.entries(T).map(([n,t])=>`<div class="card"><div class="r"><b>${n}</b><span>${fmt(t.cost)} ₯</span></div><small>Capacità ${t.cap} · velocità ${t.v} mn/giorno · mantenimento ${(t.cap/30).toFixed(1)} ₯/giorno</small><div class="b"><button onclick="buyShip('${n}')">Compra a ${c}</button></div></div>`).join('')}
 <h2>La tua flotta</h2>
 ${S.ships.map(s=>`<div class="card"><div class="r"><b>${s.name}</b><span class="m">${s.type}</span></div><small>${s.dest?'In mare verso '+s.dest:'A '+s.city} · Cannoni ${s.arm||0}/6 · Armi ${s.wp||0}/3 · Scafo ${Math.round(hp(s))}%</small>${!s.dest?`<div class="b"><button onclick="armShip(${s.id},'c')">Cannone +1 (400 ₯)</button><button onclick="armShip(${s.id},'w')">Armi +1 (200 ₯)</button>${hp(s)<100?`<button onclick="repair(${s.id})">Ripara (${Math.ceil((100-hp(s))*3)} ₯)</button>`:''}<button onclick="sellShip(${s.id})">Vendi per ${fmt(T[s.type].cost*.5)} ₯</button></div>`:''}</div>`).join('')||'<p>Nessuna nave.</p>'}`;
},
citta(){
 const c=S.ui.city,pp=S.pop[c]||0,pr=S.pros[c]||0,f=pf(c)*100;
 return `<h2>Città</h2>${citySel()}
 <div class="card"><div class="r"><b>${c}</b><span class="m">${C[c][0]}</span></div>
 <small>Popolarità ${pp.toFixed(1)}/100 · sconto ${f.toFixed(1)}% sugli acquisti e +${f.toFixed(1)}% sulle vendite</small><div class="pb"><i style="width:${Math.max(0,pp)}%"></i></div>
 <small>Abitanti ${fmt(S.popu[c]*1000)}: poveri ${fmt(S.popu[c]*600)}, benestanti ${fmt(S.popu[c]*300)}, ricchi ${fmt(S.popu[c]*100)}</small><br><small>Soddisfazione ${S.sat[c].toFixed(0)}/100${S.sat[c]<25?' · CRISI: fame e malcontento':''}</small><div class="pb"><i style="width:${S.sat[c]}%"></i></div><small>Prosperità ${pr.toFixed(1)}/100 · aumenta la soddisfazione e la crescita degli abitanti</small><div class="pb"><i style="width:${pr}%"></i></div>
 <small>La popolarità cresce commerciando, donando e costruendo opere.</small><br><small>${can(c)?'Puoi costruire qui depositi, laboratori e opere.':need(c)}</small></div>
 ${dipl(c)}
 <h2>Donazioni</h2><div class="b">${[100,500,1000].map(n=>`<button onclick="donate(${n})">${n} ₯</button>`).join('')}</div><div style="height:8px"></div>
 <h2>Opere cittadine</h2>
 ${CIV.map((b,i)=>{const own=S.civ[c].includes(i);return `<div class="card"><div class="r"><b>${b[0]}</b><span class="m">${fmt(b[1])} ₯</span></div><small>${b[6]}<br>Popolarità +${b[3]} · prosperità +${b[4]}${b[5]?` · rende ${b[5]} ₯/giorno`:''}${own?'':` · richiede popolarità ${b[2]}`}</small>${own?'<div class="b"><button disabled>Costruita</button></div>':`<div class="b"><button onclick="civ(${i})">Costruisci</button></div>`}</div>`}).join('')}`;
},
imprese(){
 const gs=`<option value="-1">Niente</option>`+G.map((g,i)=>`<option value="${i}">${g}</option>`).join('');
 const co=sel=>Object.keys(C).map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
 return `<h2>Laboratori</h2><small>Producono nel deposito della città (serve spazio libero): 3 unità al giorno per livello, ×1,5 se la città produce quella merce. Vetro (legname e sale) e Panni (lana e allume) consumano le materie prime dal tuo deposito. Mantenimento 3 ₯ al giorno per livello.</small>${citySel()}${can(S.ui.city)?'':`<div class="card"><small>${need(S.ui.city)}</small></div>`}
 <select id="bg">${G.map((g,i)=>`<option value="${i}">${g}</option>`).join('')}</select>
 <div class="b"><button onclick="build()">Costruisci a ${S.ui.city} (1.500 ₯)</button></div><div style="height:8px"></div>
 ${S.bld.map((b,i)=>`<div class="card"><div class="r"><b>${G[b.good]} · ${b.city}</b><span class="m">Livello ${b.lv}/5</span></div><small>${(3*b.lv*(C[b.city][3].includes(b.good)?1.5:1)).toFixed(1)} unità al giorno${S.wh[b.city]?'':' · nessun deposito in questa città!'}</small>${b.lv<5?`<div class="b"><button onclick="upgrade(${i})">Potenzia (1.000 ₯)</button></div>`:''}</div>`).join('')}
 <h2>Rotte automatiche</h2><small>La nave vende tutto il carico, compra la merce scelta per quel porto e riparte per l’altro porto.</small><div style="height:8px"></div>
 ${S.ships.map(s=>{const r=s.route;return `<div class="card"><div class="r"><b>${s.name}</b><span class="m">${s.type}</span></div>`+(r?`<small>${r.a} (compra ${r.ga>=0?G[r.ga]:'niente'}) ⇄ ${r.b} (compra ${r.gb>=0?G[r.gb]:'niente'})</small><div class="b"><button onclick="stopRoute(${s.id})">Ferma rotta</button></div>`:`<small>Porto A e merce da comprare lì; porto B e merce da comprare lì.</small><select id="ra${s.id}">${co(s.city)}</select><select id="rga${s.id}">${gs}</select><select id="rb${s.id}">${co('')}</select><select id="rgb${s.id}">${gs}</select><div class="b"><button onclick="setRoute(${s.id})">Avvia rotta</button></div>`)+`</div>`}).join('')||'<p>Nessuna nave.</p>'}`;
},
diario(){
 return `<h2>Diario</h2><div class="card"><div class="r"><span>Mercante</span><b>${S.name}</b></div><div class="r"><span>Titolo</span><b>${RANKS[S.rank][0]}</b></div>${RANKS[S.rank+1]?`<small>Prossimo titolo, ${RANKS[S.rank+1][0]}: patrimonio ${fmt(RANKS[S.rank+1][1])} ₯</small>`:''}<div class="r"><span>Città d’origine</span><b>${S.home}</b></div><div class="r"><span>Ducati</span><b>${fmt(S.gold)} ₯</b></div><div class="r"><span>Patrimonio stimato</span><b>${fmt(worth())} ₯</b></div><small>Include navi (metà del prezzo), merci, depositi, meno i debiti; i magazzini di tua proprietà contano.</small></div>
 <div class="card"><div class="r"><b>Banca</b><span class="m">Debito ${fmt(S.debt)} ₯ · limite ${fmt(lim())} ₯</span></div><small>Interesse 0,1% al giorno. Il limite cresce con il titolo.</small><div class="b"><button onclick="loan(500)">Prendi 500 ₯</button><button onclick="loan(5000)">Prendi 5.000 ₯</button><button onclick="loan(50000)">Prendi 50.000 ₯</button></div><div class="b"><button onclick="loan(-500)">Rimborsa 500 ₯</button><button onclick="loan(-5000)">Rimborsa 5.000 ₯</button><button onclick="loan(-1e9)">Rimborsa tutto</button></div></div>${neutCard()}<div class="card log">${S.log.map(l=>`<p>${l}</p>`).join('')}</div>
 <div class="b"><button onclick="if(confirm('Cancellare la partita e ricominciare?')){speed=0;acc=0;init();done('Nuova partita')}">Nuova partita</button></div>`;
}
};
function renderTop(){$('#top').innerHTML=S.started?`<span>Giorno ${S.day}</span><span>${fmt(S.gold)} ₯</span>`:'<span>Mercanti del Mediterraneo</span>';$('#sub').innerHTML=S.started?`${S.name}, ${RANKS[S.rank][0]}${S.debt?' · debito '+fmt(S.debt)+' ₯':''} · ${SN[seas()]}${Object.keys(S.war).length?' · ⚔ guerra':''}`:''}
function renderSpeed(){
 $('#spd').innerHTML=[['Pausa',0],['1X',1],['2X',2],['4X',4]].map(([l,v])=>`<button class="${speed===v?'on':''}" onclick="setSpeed(${v})">${l}</button>`).join('');
}
function render(keep){
 const u=S.ui;
 document.body.classList.toggle('start',!S.started);
 renderTop();renderSpeed();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===u.tab));
 const sv=[...document.querySelectorAll('#main select')].map(s=>s.value);
 $('#main').innerHTML=S.started?P[u.tab]():P.inizio();
 if(keep)[...document.querySelectorAll('#main select')].forEach((s,i)=>{if(sv[i]!==undefined&&[...s.options].some(o=>o.value===sv[i]||o.text===sv[i]))s.value=sv[i]});
}
render();
</script>
</body>
</html>
